name: Issue graph

# When an issue closes or reopens, flip its dependents between `blocked` and `ready`.
on:
  issues:
    types: [closed, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-graph
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/issues/sync-ready.ts
        env:
          GH_TOKEN: ${{ github.token }}
