name: Fuzz

# Each fuzz target for ten minutes, nightly; crashing inputs are uploaded as artifacts.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '600'
      targets:
        description: Fuzz target group
        type: choice
        options: [all, graph-parsers]
        default: all

env:
  ZIG_VERSION: 0.17.0-dev.1857+3c46da14d

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ fromJSON(inputs.targets == 'graph-parsers' && '["osm-pbf","osm-primitives","osm-dense","graph-bundle","live-traffic","traffic-feed","predicted-speed","mvt","time-domain","lane-tags","name-tags"]' || '["request","http","polyline","lz4","dem","protobuf","config","osm-pbf","osm-primitives","osm-dense","node-store","graph-bundle","live-traffic","traffic-feed","predicted-speed","mvt","build-checkpoint","valhalla-tile","costing-reference","motor-costing","range-manifest","http-range","usage-directory","speed-config","motor-tags","admin-index","timezone-geojson","timezone-rules","datetime","time-domain","lane-tags","name-tags","gtfs-csv"]') }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: scripts/fuzz.sh -s "$FUZZ_SECONDS" "${{ matrix.target }}"
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '600' }}
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: crashers-${{ matrix.target }}
          path: fuzz-crashers/
