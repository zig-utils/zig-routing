name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # The one pinned toolchain. build.zig.zon and deps.yaml must name the same build.
  ZIG_VERSION: 0.17.0-dev.1857+3c46da14d

jobs:
  pin:
    name: Toolchain pin agrees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: build.zig.zon and deps.yaml match the CI pin
        run: |
          zon=$(grep -o 'minimum_zig_version = "[^"]*"' build.zig.zon | cut -d'"' -f2)
          deps=$(grep -o 'zig: .*' deps.yaml | cut -d' ' -f2)
          echo "ci=$ZIG_VERSION zon=$zon deps=$deps"
          [ "${ZIG_VERSION%%+*}" = "$zon" ] || { echo "build.zig.zon pins $zon, CI pins $ZIG_VERSION"; exit 1; }
          [ "$ZIG_VERSION" = "$deps" ] || { echo "deps.yaml pins $deps, CI pins $ZIG_VERSION"; exit 1; }

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ${{ matrix.os }}-${{ hashFiles('build.zig.zon') }}
      - run: zig build
      - run: zig build test --summary all
      - run: zig build -Doptimize=ReleaseFast
      - name: Valhalla tag parity
        if: matrix.os == 'ubuntu-latest'
        run: oracle/tag-goldens.sh compare
      - name: Validate assembled fixture bundles
        if: matrix.os == 'ubuntu-latest'
        run: |
          source oracle/lib.sh
          work=$(mktemp -d)
          for dataset in liechtenstein utrecht; do
            zig build check-assembly -- "oracle/data/$dataset/extract.osm.pbf" "$work/$dataset" "$work" 4 right
          done
          for dataset in liechtenstein utrecht; do
            input="oracle/data/$dataset/extract.osm.pbf"
            zig-out/bin/zr build "$input" --work-dir "$work/$dataset-full-work" --output "$work/$dataset-full" --threads 4
            zig-out/bin/zr inspect --verify "$work/$dataset-full"
            for workers in 1 16; do
              zig-out/bin/zr build "$input" --work-dir "$work/$dataset-$workers-work" --output "$work/$dataset-$workers" --threads "$workers"
              zig-out/bin/zr inspect --verify "$work/$dataset-$workers"
              diff -qr "$work/$dataset-full" "$work/$dataset-$workers"
            done
            echo "$dataset has identical bundle bytes with 1, 4 and 16 workers"
            zig-out/bin/zr build "$input" --work-dir "$work/$dataset-split-work" --to enhance --threads 4
            zig-out/bin/zr build --work-dir "$work/$dataset-split-work" --from elevation --output "$work/$dataset-resumed" --threads 4
            diff -qr "$work/$dataset-full" "$work/$dataset-resumed"
          done
          zig build bench-costing -Doptimize=ReleaseFast -- "$work/utrecht-full" 100000
          oracle/fetch.sh liechtenstein
          zig build check-assembly -Doptimize=ReleaseFast -- "$ORACLE_DATA/liechtenstein/extract.osm.pbf" "$work/liechtenstein-dem" "$work" 4 right --dem "$ORACLE_DATA/liechtenstein/elevation"
          cp -R "$ORACLE_DATA/liechtenstein/elevation" "$work/dem-copy"
          zig-out/bin/zr build "$ORACLE_DATA/liechtenstein/extract.osm.pbf" --dem "$ORACLE_DATA/liechtenstein/elevation" --output "$work/dem-1" --threads 1
          zig-out/bin/zr build "$ORACLE_DATA/liechtenstein/extract.osm.pbf" --dem "$work/dem-copy" --output "$work/dem-16" --threads 16
          diff -qr "$work/dem-1" "$work/dem-16"
          fetch_checked \
            https://download.geofabrik.de/europe/luxembourg-260101.osm.pbf \
            "$work/luxembourg.osm.pbf" \
            d8f3e1dabb4d9d5489500c35432eb393089c32222cfff8cf50706852f0696a80
          zig build check-assembly -Doptimize=ReleaseFast -- "$work/luxembourg.osm.pbf" "$work/luxembourg" "$work" 4 right --sub-byte-turns --spatial-budget
      - uses: actions/checkout@v6
        if: matrix.os == 'ubuntu-latest'
        with:
          repository: valhalla/valhalla
          ref: 5c7f918e61306521d79cc4496d40c19c5305fa4b
          path: zig-out/valhalla-schema-source
          sparse-checkout: proto/descriptors
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        if: matrix.os == 'ubuntu-latest'
      - name: Valhalla Protobuf schema parity
        if: matrix.os == 'ubuntu-latest'
        run: bun tools/proto/valhalla.ts --check zig-out/valhalla-schema-source

  cpu:
    name: CPU release (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-linux-gnu
            cpus: baseline x86_64_v3
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-gnu
            cpus: baseline
          - runner: macos-15-intel
            target: x86_64-macos
            cpus: baseline x86_64_v3
          - runner: macos-latest
            target: aarch64-macos
            cpus: baseline
    env:
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_CPUS: ${{ matrix.cpus }}
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: cpu-${{ matrix.target }}-${{ hashFiles('build.zig.zon') }}
      - name: Build and test each CPU profile
        run: |
          for cpu in $BUILD_CPUS; do
            zig build test -Dtarget="$BUILD_TARGET" -Dcpu="$cpu" -Doptimize=ReleaseFast --summary all
          done
      - name: Compare kernel output and measure each profile
        run: |
          if command -v lscpu >/dev/null; then
            lscpu | awk -F ': *' '/^Model name:/ { print $2 }'
          else
            sysctl -n machdep.cpu.brand_string
          fi
          for cpu in $BUILD_CPUS; do
            zig build bench-cpu -Dtarget="$BUILD_TARGET" -Dcpu="$cpu" -Doptimize=ReleaseFast > "$RUNNER_TEMP/cpu-$cpu.json"
            cat "$RUNNER_TEMP/cpu-$cpu.json"
          done
          if [ -f "$RUNNER_TEMP/cpu-x86_64_v3.json" ]; then
            python3 - "$RUNNER_TEMP/cpu-baseline.json" "$RUNNER_TEMP/cpu-x86_64_v3.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          baseline, v3 = [json.loads(Path(file).read_text()) for file in sys.argv[1:]]
          for kernel in ("snap_projection", "polyline_encode"):
              assert baseline[kernel]["digest"] == v3[kernel]["digest"], kernel
              base_ns = baseline[kernel]["ns_per_item"]
              v3_ns = v3[kernel]["ns_per_item"]
              print(f"{kernel} baseline {base_ns:.3f} ns v3 {v3_ns:.3f} ns gain {(1 - v3_ns / base_ns) * 100:.2f}%")
          PY
          fi

  corpus:
    name: Corpora regenerate byte-identical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun tools/corpus/generate.ts --check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig fmt --check build.zig build.zig.zon src test packages
      - name: OS access goes through the IO shim only
        run: |
          hits=$(grep -rnE 'std\.(Io\.(Dir|File|net|Clock|Threaded|Kqueue|Uring|Dispatch)|fs\.cwd|time\.Timer|posix\.(socket|accept|mmap))' src --include='*.zig' | grep -v '^src/infra/io.zig:' || true)
          if [ -n "$hits" ]; then echo "Use src/infra/io.zig instead of:"; echo "$hits"; exit 1; fi
